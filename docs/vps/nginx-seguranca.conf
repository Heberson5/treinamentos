# Cabeçalhos de segurança para o nginx do container do app.
# Inclua dentro do bloco "server { ... }" do nginx.conf do app.
# Troque api.sauberlich.com.br se o endereço da API for outro.

server_tokens off;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Ative só depois de confirmar que o site abre sempre por HTTPS:
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Comece com Report-Only; sem avisos no console por alguns dias, troque por
# "Content-Security-Policy".
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self' https://api.sauberlich.com.br wss://api.sauberlich.com.br; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# O index.html não deve ficar em cache (para as atualizações aparecerem na hora);
# os arquivos com hash em /assets podem ficar em cache por 1 ano.
location = /index.html {
  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
location /assets/ {
  add_header Cache-Control "public, max-age=31536000, immutable" always;
}
